[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gisec"
version = "0.1.0"
description = "GISEC: Graph-based Instance Segmentation for Electronic Components"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy==2.4.3",
  "opencv-python==4.13.0.92",
  "pycocotools==2.0.11",
  "PyYAML==6.0.3",
  "scipy==1.15.2",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==4.57.6",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
gisec = "gisec.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gisec*"]
