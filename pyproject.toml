[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gisec"
version = "0.1.0"
description = "GISEC: Graph-based Instance Segmentation for Electronic Components"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy",
  "opencv-python",
  "pycocotools",
  "torch",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gisec*"]
