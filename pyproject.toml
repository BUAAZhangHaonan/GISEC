[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gisec"
version = "0.2.0"
description = "GISEC: Instance Segmentation for Electronic Components in Dense Clutter"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numba>=0.67.0",
  "numpy==2.4.3",
  "opencv-python==4.13.0.92",
  "pycocotools==2.0.11",
  "scikit-image>=0.26.0",
  "scipy==1.15.2",
  "segmentation-models-pytorch>=0.5.0",
  "timm>=1.0.28",
  "torch==2.10.0",
  "torchvision==0.25.0",
  "transformers==4.57.6",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
gisec-train = "gisec.train:main"
gisec-eval = "gisec.eval.fullval:main"
gisec-build-gt = "gisec.datasets.build_gt_records:main"
gisec-build-band = "gisec.datasets.build_band_records:main"
gisec-build-projanchor = "gisec.datasets.build_proj_anchor_records:main"
gisec-build-rgb-cache = "gisec.datasets.build_rgb_cache:main"
gisec-postproc-cache = "gisec.postproc_fast:precompute_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gisec*"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F",
  "I", "RUF", "UP", "PLR0402", "SIM", "B",
]

[tool.ruff.lint.isort]
known-first-party = ["conftest", "gisec"]
