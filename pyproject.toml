[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gisec"
version = "0.1.0"
description = "GISEC: Graph-based Instance Segmentation for Electronic Components"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy",
  "opencv-python",
  "pycocotools",
  "PyYAML",
  "scipy==1.15.2",
  "torch==2.7.0",
  "torchvision==0.22.0",
  "transformers",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[project.scripts]
gisec = "gisec.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["gisec*"]
