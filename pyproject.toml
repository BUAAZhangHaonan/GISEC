[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affinigraph"
version = "0.1.0"
description = "AffiniGraph: reference-conditioned RGB-D fragment graph reasoning for ECC instance segmentation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "numpy",
  "opencv-python",
  "pycocotools",
  "torch",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["affinigraph*"]
