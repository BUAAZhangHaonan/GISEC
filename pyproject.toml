[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnn-reference-prior"
version = "0.1.0"
description = "Reference-conditioned RGB-D UNet with graph reasoning for ECC instance segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "opencv-python",
  "pycocotools",
  "torch",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gnn_reference_prior*"]
