common:
  image_size: 1024
  batch: 2
  num_workers: 0
  device: cpu
train:
  epochs: 1
  max_train_steps: 1
  max_val_images: 1
  amp: false
model:
  model_name: unet
  input_mode: rgb
  encoder_name: resnet34
  pretrained_backbone: false
  task_mode: instance
  threshold: 0.5
  core_erosion_px: 3
  boundary_band_px: 5
  watershed_enabled: true
  use_depth_split_walls: true
  depth_wall_threshold: 0.1
  center_threshold: 0.5
  fragment_min_area: 8
  decoder_channels: 64
  render_overlay_limit: 0
