common:
  image_size: 1024
  batch: 1
  num_workers: 4
  device: cuda
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  eval_every_epochs: 1
train:
  epochs: 20
  max_train_steps: 0
  max_val_images: 0
  amp: true
  grad_accum_steps: 2
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  momentum: 0.9
model:
  model_family: mask_rcnn
  backbone_name: resnet50_fpn
  input_mode: rgb
  variant: rgb_full_1024
  pretrained: true
  score_threshold: 0.05
  refine_mode: none
  inference_defaults_locked: true
  render_overlay_limit: 8
