common:
  device: cuda
train:
  epochs: 5
  batch_size: 8
  num_workers: 4
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  max_train_steps: 0
  val_split: val
  decision_threshold: 0.5
  positive_edge_weight: 1.0
  negative_edge_weight: 3.0
  hard_negative_ratio: 0.0
  ranking_loss_weight: 0.0
  ranking_margin: 0.2
  ranking_samples_per_class: 128
model:
  reference_image_size: 128
  reference_max_views: 16
  reference_view_sampler: pose_farthest
  hidden_dim: 64
  reference_hidden_dim: 32
