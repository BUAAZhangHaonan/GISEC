common:
  image_size: 1024
  batch: 4
  num_workers: 4
  device: cuda
train:
  epochs: 20
  max_train_steps: 0
  max_val_images: 0
  amp: true
  grad_accum_steps: 1
  learning_rate: 1.0e-4
  encoder_lr_multiplier: 0.25
  fg_loss_weight: 1.0
  center_loss_weight: 4.0
  offset_loss_weight: 0.25
  boundary_loss_weight: 0.5
model:
  model_name: unet
  input_mode: rgbd
  encoder_name: resnet34
  pretrained_backbone: true
  task_mode: instance
  threshold: 0.5
  center_threshold: 0.5
  min_area: 8
  decoder_channels: 64
