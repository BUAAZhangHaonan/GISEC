common:
  image_size: 1024
  batch: 8
  num_workers: 4
  device: cuda
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  eval_every_epochs: 1
train:
  epochs: 1
  max_train_steps: 32
  max_val_images: 16
  amp: true
  grad_accum_steps: 1
  learning_rate: 1.0e-4
  encoder_lr_multiplier: 0.25
  fg_loss_weight: 1.0
  center_loss_weight: 4.0
  offset_loss_weight: 0.25
  boundary_loss_weight: 0.5
model:
  model_name: unet
  input_mode: rgb
  encoder_name: resnet34
  pretrained_backbone: true
  task_mode: instance
  threshold: 0.12
  core_erosion_px: 3
  boundary_band_px: 5
  watershed_enabled: true
  use_depth_split_walls: true
  depth_wall_threshold: 0.1
  center_threshold: 0.002
  fragment_min_area: 8
  decoder_channels: 64
  render_overlay_limit: 0
