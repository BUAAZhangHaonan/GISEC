common:
  device: cuda
  image_size: 1024
  num_workers: 4
cache:
  crop_size: 256
  crop_pad: 16
  feature_channels: 32
  inference_batch_size: 4
  target_solidity: 0.92
  min_match_iou: 0.20
  min_concavity_depth_px: 6.0
model:
  variant: base_rgb_1024
  model_family: mask2former
  backbone_name: swin_t
  input_mode: rgb
  fusion_mode: rgb
  depth_mode: rgb
  inference_defaults_locked: true
  pretrained_model_name: facebook/mask2former-swin-tiny-coco-instance
  score_threshold: 0.5
  mask_threshold: 0.5
  refine_mode: none
  hidden_dim: 32
  num_queries: 0
train:
  epochs: 10
  batch_size: 4
  learning_rate: 0.001
  max_train_steps: 0
stage2_model:
  hidden_dim: 32
  num_queries: 0
train:
  epochs: 8
  batch_size: 16
  num_workers: 4
  learning_rate: 0.001
  max_train_steps: 0
eval:
  batch_size: 16
  num_workers: 4
