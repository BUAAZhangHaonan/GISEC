name: gisec
channels:
  - defaults
dependencies:
  - python=3.12
  - pip
  - ninja
  - pip:
      - numpy
      - pytest
      - opencv-python
      - pycocotools
      - PyYAML==6.0.3
      - scipy==1.15.2
      - matplotlib==3.10.1
      - transformers
      - --index-url https://download.pytorch.org/whl/cu128
      - --extra-index-url https://pypi.org/simple
      - torch==2.7.0
      - torchvision==0.22.0
